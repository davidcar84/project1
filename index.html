<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <meta name="description" content="Workout Tracker - Log sets, track strength progress" />
  <title>Workout Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-mark">💪</span>
        <span>Workout Tracker</span>
      </div>
      <div class="header-actions">
        <button class="install-btn" id="installBtn" hidden>+ Install</button>
        <button class="icon-btn" id="signOutBtn" hidden title="Sign out">⎋</button>
      </div>
    </div>
  </header>

  <main class="main" id="mainView">
    <div class="loading-screen" id="bootLoader">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </main>

  <nav class="bottom-nav" id="bottomNav" hidden>
    <a href="#/" data-nav="home"><span>🏠</span><small>Home</small></a>
    <a href="#/library" data-nav="library"><span>📚</span><small>Exercises</small></a>
    <a href="#/settings" data-nav="settings"><span>⚙️</span><small>Settings</small></a>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
    }
  </script>
</body>
</html>
